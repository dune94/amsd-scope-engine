name: drivers
step: "1e"
description: Complexity and Risk drivers present, each with a dated quote
model: claude-sonnet-5-5
system_instructions: drivers.si.md
prompt: drivers.prompt.md
schema: drivers.schema.json
# inline = system instructions + prompt sent as one message, in inline_order (the way the PI-12 runs sent them);
# append / replace = system instructions sent as a system prompt (llm.system_prompt_flags in config/scope.yml)
si_mode: inline
inline_order: [si, prompt]
tools: []
allowed_tools: []
max_turns: null
images: true          # ticket images are given to the agent (Read tool, attachments folder only)
timeout_s: 300
memory_mb: 2048
params: {}
